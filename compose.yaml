services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: evcharging
      POSTGRES_USER: evcharging
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in a private .env file}
    volumes:
      - evcharging-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evcharging -d evcharging"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
  app:
    build: .
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      SERVER_ADDRESS: 0.0.0.0
      DB_URL: jdbc:postgresql://db:5432/evcharging
      DB_USERNAME: evcharging
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in a private .env file}
      APP_ADMIN_EMAIL: ${APP_ADMIN_EMAIL:?Set APP_ADMIN_EMAIL in a private .env file}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:?Set APP_ADMIN_PASSWORD in a private .env file}
    ports:
      - "127.0.0.1:${SERVER_PORT:-8081}:8081"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  evcharging-postgres:
