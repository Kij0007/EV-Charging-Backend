# Isolated in-memory database; no PostgreSQL service or real credentials are used.
spring.datasource.url=jdbc:h2:mem:evcharging-tests;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false
spring.datasource.hikari.connection-init-sql=
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
payment.mode=mock
payment.gateway=stripe
notification.mode=mock
notification.type=email
app.admin.email=
app.admin.password=
