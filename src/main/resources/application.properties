# The website and JSON API share one origin and an authenticated server-side session.
spring.application.name=ev-charging-backend
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${SERVER_PORT:${PORT:8081}}
# Local/direct deployments ignore spoofable forwarding headers. A deployment
# profile may enable native processing only for its trusted proxy boundary.
server.forward-headers-strategy=none

# PostgreSQL is retained. Supply credentials through the environment.
spring.datasource.url=${DB_URL:jdbc:postgresql://127.0.0.1:55432/evcharging}
spring.datasource.username=${DB_USERNAME:evcharging}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.connection-init-sql=SET lock_timeout TO '5s'

# Flyway owns schema changes. Never infer a baseline on an existing database.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false
spring.flyway.validate-on-migrate=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never

# Session credentials stay in an HttpOnly cookie, never browser localStorage.
server.servlet.session.timeout=30m
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=false
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Optional first administrator; registration never accepts a role.
# Empty values create no administrator. Production operations must configure both.
app.admin.email=${APP_ADMIN_EMAIL:}
app.admin.password=${APP_ADMIN_PASSWORD:}

# Retained integration-demo settings: these example providers are mocks.
# The website does not initiate online payments or send external messages.
payment.mode=${PAYMENT_MODE:mock}
payment.gateway=${PAYMENT_GATEWAY:stripe}
notification.mode=${NOTIFICATION_MODE:mock}
notification.type=${NOTIFICATION_TYPE:email}

# The API accepts JSON and has no upload endpoints; avoid unused multipart parsing.
spring.servlet.multipart.enabled=false

# Reject client-supplied persistence identifiers and relationship fields absent from request DTOs.
spring.jackson.deserialization.fail-on-unknown-properties=true
