# PC-hosted application, reached through the approved ngrok HTTPS endpoint.
# Keep the application port off the LAN and retain the existing PC database settings.
server.address=127.0.0.1
server.servlet.session.cookie.secure=true
server.forward-headers-strategy=native

# The local ngrok agent is the only trusted forwarding hop. ngrok appends the
# actual visitor to X-Forwarded-For; Tomcat walks from the right and stops at
# the first non-loopback address, ignoring a caller's forged leftmost prefix.
server.tomcat.remoteip.internal-proxies=127.0.0.1/32,::1/128
server.tomcat.remoteip.trusted-proxies=
server.tomcat.remoteip.remote-ip-header=X-Forwarded-For
server.tomcat.remoteip.protocol-header=X-Forwarded-Proto
server.tomcat.remoteip.host-header=
server.tomcat.remoteip.port-header=

# Reuse the existing bounded session manager; do not change booking rules.
app.security.max-active-sessions=512

# No datasource, Flyway, administrator, or demo-mode override belongs here.
# Use the public HTTPS URL for login; retain the local profile for ordinary HTTP.
# The tunnel must redirect/reject public HTTP before application credentials.
